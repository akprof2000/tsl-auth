# CI/CD TSL Auth: сборка → тесты → сканирование безопасности → образ в GHCR и Docker Hub.
#
# Публикация образа: push в main (тег latest + sha) и теги vX.Y.Z (семантические версии).
# Перед публикацией обязательно проходит полный стенд E2E (UI, нагрузка, отказы — ~8 мин): latest
# не появляется без проверки потока authorization code + PKCE в реальном браузере.
# Docker Hub включается секретами репозитория DOCKERHUB_USERNAME и DOCKERHUB_TOKEN
# (Settings → Secrets and variables → Actions). Без них образ публикуется только в GHCR.
#
# Все actions закреплены по SHA коммита (версия — в комментарии): тег action можно перевесить, а пайплайн
# ставит keyless-подпись на образ. Dependabot (github-actions) обновляет SHA вместе с комментарием.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR: новый push отменяет устаревший прогон. main и теги не прерываются — иначе публикация и подпись
# могли бы оборваться на середине; следующий прогон ждёт своей очереди.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IMAGE_NAME: tsl-auth

jobs:
  build-test:
    name: Сборка и тесты (unit + интеграционные SQLite/PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TslAuth.sln

      - name: Build
        run: dotnet build TslAuth.sln -c Release --no-restore -warnaserror

      - name: Unit-тесты
        run: dotnet test tests/TslAuth.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      # Testcontainers поднимает настоящий PostgreSQL в Docker раннера.
      - name: Интеграционные тесты (SQLite + PostgreSQL)
        run: dotnet test tests/TslAuth.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      # Все проекты решения, а не только сервис: тестовые зависимости тоже исполняются в CI с доступом к Docker.
      - name: Уязвимые NuGet-пакеты
        run: |
          dotnet list TslAuth.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q -E "(Critical|High)" vulnerable.txt; then echo "::error::Найдены уязвимые пакеты"; exit 1; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: TestResults
          retention-days: 1

  security-scan:
    name: Сканирование репозитория (секреты, конфигурация)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy — секреты и ошибки конфигурации (Dockerfile, compose)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          skip-dirs: tests/artifacts

  docs:
    name: Документация (Mermaid, ссылки, якоря, таблицы)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Все диаграммы проверяются тем же парсером Mermaid, что и на GitHub; битая ссылка или якорь — ошибка сборки.
      - name: Проверка README.md и docs/*.md
        shell: pwsh
        run: ./scripts/validate-docs.ps1

  # Полный стенд — тот же workflow, что запускается вручную и по расписанию; обязательное условие публикации.
  # Идёт параллельно с остальными проверками (образ для стенда собирает сам), так что публикация
  # задерживается не на сумму, а на самую долгую из задач.
  e2e:
    name: E2E
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  docker:
    name: Образ → сканирование → публикация
    needs: [build-test, security-scan, docs, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless-подпись cosign через OIDC GitHub (Sigstore)
      security-events: write   # отчёт Trivy во вкладку Security → Code scanning
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/tsl-auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Вход в GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Вход в Docker Hub — до формирования тегов: если вход не удался, образ публикуется только в GHCR
      # (с предупреждением), а не валит всю сборку. Пробелы и переводы строк, случайно попавшие в секреты
      # при вставке, обрезаются. Значения секретов в лог не выводятся — только признаки типичных ошибок.
      - name: Вход в Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          user="$(printf '%s' "$DH_USER" | tr -d '[:space:]')"
          token="$(printf '%s' "$DH_TOKEN" | tr -d '[:space:]')"
          if printf '%s' "$token" | docker login docker.io -u "$user" --password-stdin; then
            echo "DOCKERHUB_USERNAME=$user" >> "$GITHUB_ENV"
            exit 0
          fi
          hint=""
          printf '%s' "$user"  | LC_ALL=C grep -q '[^ -~]' && hint="$hint DOCKERHUB_USERNAME содержит не-ASCII символы (кириллица? другая раскладка?)."
          printf '%s' "$token" | LC_ALL=C grep -q '[^ -~]' && hint="$hint DOCKERHUB_TOKEN содержит не-ASCII символы."
          case "$user" in *@*) hint="$hint DOCKERHUB_USERNAME похож на email — нужен Docker ID (имя пользователя), а не почта.";; esac
          case "$user" in *:*) hint="$hint DOCKERHUB_USERNAME содержит ':' — укажите только имя, без токена.";; esac
          printf '%s' "$user" | grep -Eq '^[a-z0-9]{4,30}$' || hint="$hint DOCKERHUB_USERNAME не похож на Docker ID (4–30 строчных латинских букв и цифр, длина сейчас ${#user})."
          case "$token" in dckr_pat_*|dckr_oat_*) ;; *) hint="$hint DOCKERHUB_TOKEN не похож на токен Docker Hub (ожидается dckr_pat_...).";; esac
          [ -z "$token" ] && hint="$hint DOCKERHUB_TOKEN пуст."
          echo "::warning title=Docker Hub::Вход не удался, образ публикуется только в GHCR.${hint:- Проверьте логин и токен (Account settings → Personal access tokens, права Read & Write).}"
          echo "DOCKERHUB_USERNAME=" >> "$GITHUB_ENV"

      - name: Теги образа
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/{1}', env.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Образ собирается ОДИН раз и загружается в GHCR только по digest, без тегов: пока проверки не пройдены,
      # его не получить ни по latest, ни по версии. Дальше сканируется, тегируется и подписывается именно
      # этот digest. Если проверки не пройдут, в GHCR останется непомеченная версия пакета (без тегов).
      # Кэш слоёв — в кэше GitHub Actions; cleanup.yml ежедневно его стирает, поэтому первая сборка за сутки холодная.
      - name: Сборка и загрузка по digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max   # SLSA provenance: как, где и из какого коммита собран образ
          sbom: true             # перечень компонентов (SPDX) прикладывается к образу

      # docker pull по digest сверяет содержимое: локально оказывается ровно то, что лежит в реестре.
      - name: Образ для проверок (тот же digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$GHCR_IMAGE@$DIGEST"
          docker save "$GHCR_IMAGE@$DIGEST" -o image.tar

      # Полный отчёт (все уровни) — во вкладку Security репозитория, чтобы видеть и MEDIUM/LOW.
      - name: Trivy — полный отчёт (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-image.sarif

      - name: Отчёт Trivy → GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Публикация блокируется, если в образе есть уязвимости CRITICAL/HIGH с доступным исправлением.
      - name: Trivy — уязвимости образа (блокирующая проверка)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # CIS-правила для образов (пользователь, секреты в слоях, setuid-файлы, HEALTHCHECK и т.д.).
      # Dockle читает сохранённый архив образа: сокет Docker стороннему контейнеру не передаётся.
      - name: Dockle — соответствие CIS Docker Benchmark
        run: |
          docker run --rm -v "$PWD/image.tar:/image.tar:ro" \
            goodwithtech/dockle:v0.4.15@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9 \
            --exit-code 1 --exit-level warn --input /image.tar

      # Теги ставятся на уже проверенный digest: imagetools create с одним источником копирует манифест
      # без изменений (digest тот же), в Docker Hub — вместе со слоями, SBOM и provenance.
      - name: Публикация тегов
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # TAGS — теги через перевод строки; поэлементный разбор $TAGS во внутреннем цикле намеренный.
          for repo in $(printf '%s\n' "$TAGS" | sed 's/:[^:/]*$//' | sort -u); do
            args=()
            for tag in $TAGS; do [ "${tag%:*}" = "$repo" ] && args+=(-t "$tag"); done
            docker buildx imagetools create "${args[@]}" "$GHCR_IMAGE@$DIGEST"
          done

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless-подпись (Sigstore): подпись привязана к этому репозиторию и workflow, ключей хранить не нужно.
      # Подписывается digest — один раз в каждом реестре, а не по разу на каждый тег.
      # Проверка перед запуском — см. docs/security.md («Проверка подлинности образа»).
      - name: Подпись образа (cosign)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for repo in $(printf '%s\n' "$TAGS" | sed 's/:[^:/]*$//' | sort -u); do
            cosign sign --yes "$repo@$DIGEST"
          done

      # Описание репозитория в Docker Hub — из .github/dockerhub/README.md (без Mermaid и относительных ссылок,
      # которые Docker Hub не отображает). Только для ветки main и при успешном входе в Docker Hub.
      # Токену нужны права Read, Write, Delete; с меньшими правами шаг выдаёт предупреждение, публикацию не ломает.
      - name: Описание в Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: "Аналог Keycloak на .NET 10: OAuth2/OIDC, JWT, RBAC, кластер, офлайн"
          readme-filepath: ./.github/dockerhub/README.md
