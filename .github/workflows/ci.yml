# CI/CD TSL Auth: сборка → тесты → сканирование безопасности → образ в GHCR и Docker Hub.
#
# Публикация образа: push в main (тег latest + sha) и теги vX.Y.Z (семантические версии).
# Docker Hub включается секретами репозитория DOCKERHUB_USERNAME и DOCKERHUB_TOKEN
# (Settings → Secrets and variables → Actions). Без них образ публикуется только в GHCR.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IMAGE_NAME: tsl-auth

jobs:
  build-test:
    name: Сборка и тесты (unit + интеграционные SQLite/PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TslAuth.sln

      - name: Build
        run: dotnet build TslAuth.sln -c Release --no-restore -warnaserror

      - name: Unit-тесты
        run: dotnet test tests/TslAuth.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      # Testcontainers поднимает настоящий PostgreSQL в Docker раннера.
      - name: Интеграционные тесты (SQLite + PostgreSQL)
        run: dotnet test tests/TslAuth.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Уязвимые NuGet-пакеты
        run: |
          dotnet list src/TslAuth package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q -E "(Critical|High)" vulnerable.txt; then echo "::error::Найдены уязвимые пакеты"; exit 1; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults
          retention-days: 1

  security-scan:
    name: Сканирование репозитория (секреты, конфигурация)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy — секреты и ошибки конфигурации (Dockerfile, compose)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          skip-dirs: tests/artifacts

  docs:
    name: Документация (Mermaid, ссылки, якоря, таблицы)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Все диаграммы проверяются тем же парсером Mermaid, что и на GitHub; битая ссылка или якорь — ошибка сборки.
      - name: Проверка README.md и docs/*.md
        shell: pwsh
        run: ./scripts/validate-docs.ps1

  docker:
    name: Образ → сканирование → публикация
    needs: [build-test, security-scan, docs]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless-подпись cosign через OIDC GitHub (Sigstore)
      security-events: write   # отчёт Trivy во вкладку Security → Code scanning
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Теги образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/{1}', env.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Сборка образа для проверки
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Полный отчёт (все уровни) — во вкладку Security репозитория, чтобы видеть и MEDIUM/LOW.
      - name: Trivy — полный отчёт (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-image.sarif

      - name: Отчёт Trivy → GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Публикация блокируется, если в образе есть уязвимости CRITICAL/HIGH с доступным исправлением.
      - name: Trivy — уязвимости образа (блокирующая проверка)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # CIS-правила для образов (пользователь, секреты в слоях, setuid-файлы, HEALTHCHECK и т.д.).
      - name: Dockle — соответствие CIS Docker Benchmark
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock goodwithtech/dockle:latest \
            --exit-code 1 --exit-level warn ${{ env.IMAGE_NAME }}:scan

      - name: Вход в GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Вход в Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Публикация
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max   # SLSA provenance: как, где и из какого коммита собран образ
          sbom: true             # перечень компонентов (SPDX) прикладывается к образу

      - uses: sigstore/cosign-installer@v4.1.2

      # Keyless-подпись (Sigstore): подпись привязана к этому репозиторию и workflow, ключей хранить не нужно.
      # Проверка перед запуском — см. docs/security.md («Проверка подлинности образа»).
      - name: Подпись образов (cosign)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done
