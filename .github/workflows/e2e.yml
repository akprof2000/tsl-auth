# Полный стенд: сервис в Docker + демо-приложения (.NET, Node.js, Go, Python) →
# UI-автотесты (Playwright), нагрузка (k6), сценарии отказов с переподъёмом.
# Запуск: вручную (Actions → E2E → Run workflow), раз в неделю и из CI (workflow_call) —
# там это обязательная проверка перед публикацией образа на push в main и теги. Длительность ~8 мин.
name: E2E

on:
  workflow_dispatch:
    inputs:
      load_duration:
        description: Длительность нагрузочного теста
        default: "30s"
  workflow_call:
    inputs:
      load_duration:
        description: Длительность нагрузочного теста
        type: string
        default: "30s"
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  BOOTSTRAP_API_CLIENT_ID: admin-cli
  BOOTSTRAP_API_CLIENT_SECRET: demo-admin-cli-secret-2026

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.24", cache-dependency-path: samples/go-api/go.mod }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }

      - name: Сервис (одиночный режим) + демо-данные
        shell: pwsh
        run: |
          docker compose up -d --build
          for ($i = 0; $i -lt 60; $i++) { try { if ((Invoke-WebRequest http://localhost:8080/health/ready -TimeoutSec 2).StatusCode -eq 200) { break } } catch { Start-Sleep 2 } }
          ./samples/seed-demo.ps1

      # Вывод каждого демо-приложения — в свой файл (tests/artifacts/demo): при падении UI-тестов причина
      # часто в самом приложении (не собралось, не получило секрет), а без журнала её не увидеть.
      - name: Демо-приложения
        shell: pwsh
        run: |
          $logs = Join-Path $PWD tests/artifacts/demo
          New-Item -ItemType Directory -Force $logs | Out-Null
          function Start-Demo([string]$name, [string]$exe, [string[]]$arguments, [string]$dir) {
            Start-Process $exe -ArgumentList $arguments -WorkingDirectory $dir `
              -RedirectStandardOutput (Join-Path $logs "$name.out.log") -RedirectStandardError (Join-Path $logs "$name.err.log")
          }
          $s = @{}; Get-Content samples/.env.demo | ForEach-Object { $k, $v = $_ -split '=', 2; $s[$k] = $v }
          $env:CLIENT_SECRET = $s.GO_CLIENT_SECRET
          Start-Demo go-api go @('run', '.') samples/go-api
          Start-Demo node-spa node @('server.mjs') samples/node-spa
          $env:CLIENT_SECRET = $s.PYTHON_CLIENT_SECRET
          Start-Demo python-app python @('app.py') samples/python-app
          $env:Auth__ClientSecret = $s.DOTNET_CLIENT_SECRET; $env:ASPNETCORE_URLS = 'http://localhost:5101'
          Start-Demo dotnet-mvc dotnet @('run') samples/dotnet-mvc
          foreach ($p in 5101, 5102, 5103, 5104) {
            $up = $false
            for ($i = 0; $i -lt 90 -and -not $up; $i++) { try { Invoke-WebRequest "http://localhost:$p/health" -TimeoutSec 2 | Out-Null; $up = $true } catch { Start-Sleep 2 } }
            if (-not $up) { Write-Host "::error::Демо-приложение на порту $p не поднялось (журналы — в артефакте e2e-artifacts, каталог demo)"; exit 1 }
          }

      - name: UI-автотесты (Playwright)
        shell: pwsh
        run: |
          dotnet build tests/TslAuth.UiTests
          ./tests/TslAuth.UiTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
          dotnet test tests/TslAuth.UiTests --no-build

      - name: Нагрузочный тест (k6)
        shell: pwsh
        env:
          SECURITY_TOKEN_RPM: "1000000"
          SECURITY_LOGIN_RPM: "1000000"
        run: |
          docker compose up -d
          ./tests/load/run-load.ps1 -Name ci-single -Vus 10 -Duration "${{ inputs.load_duration || '30s' }}"

      - name: Сценарии отказов (одиночный режим и кластер)
        shell: pwsh
        run: |
          $key = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          @(
            "ENCRYPTION_MASTER_KEY=$key", "POSTGRES_PASSWORD=ci-pg-password", "BOOTSTRAP_ADMIN_PASSWORD=Ci-Bootstr4p-Secret!",
            "BOOTSTRAP_API_CLIENT_ID=admin-cli", "BOOTSTRAP_API_CLIENT_SECRET=demo-admin-cli-secret-2026"
          ) | Set-Content .env
          ./tests/resilience/run-resilience.ps1 -Mode all

      # Журналы контейнеров на момент падения (какой бы режим — одиночный или кластер — ни был поднят).
      - name: Журналы контейнеров
        if: failure()
        run: |
          mkdir -p tests/artifacts
          docker ps -a > tests/artifacts/containers.txt
          for c in $(docker ps -a --format '{{.Names}}'); do docker logs "$c" > "tests/artifacts/container-$c.log" 2>&1; done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-artifacts
          path: tests/artifacts
          retention-days: 1
