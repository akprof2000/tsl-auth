# Зеркало репозитория на GitFlic (https://gitflic.ru/project/uklad/tsl-auth): после каждого push в main,
# каждого тега и по кнопке CI отправляет на GitFlic все ветки и теги с полной историей.
# Учётные данные — секреты репозитория GITFLIC_USER и GITFLIC_TOKEN (токен GitFlic с правом записи);
# в журнале шага они маскируются, в .git/config не сохраняются.
name: mirror-gitflic

# Основной репозиторий теперь GitFlic, GitHub — зеркало (scripts/mirror-github.sh): обратная отправка отключена,
# workflow оставлен только для ручного запуска на случай восстановления GitFlic из копии.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitflic
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Полная история, все ветки и теги: зеркалу нужна не только последняя ревизия.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Отправка на GitFlic
        env:
          GITFLIC_USER: ${{ secrets.GITFLIC_USER }}
          GITFLIC_TOKEN: ${{ secrets.GITFLIC_TOKEN }}
        run: |
          set -euo pipefail
          # origin/HEAD — символическая ссылка, а не ветка: в зеркало её не отправляем.
          git update-ref -d refs/remotes/origin/HEAD || true
          # Логин и токен — в адресе только этой команды (в .git/config не сохраняются; в журнале маскируются как секреты).
          # Токен кодируется: спецсимволы в нём не должны ломать URL.
          token=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["GITFLIC_TOKEN"],safe=""))')
          user=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["GITFLIC_USER"],safe=""))')
          echo "::add-mask::$token"
          git -c credential.helper= push --force --prune \
            "https://$user:$token@gitflic.ru/project/uklad/tsl-auth.git" \
            "+refs/remotes/origin/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
