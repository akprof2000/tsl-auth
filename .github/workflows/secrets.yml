# Секреты в git (gitleaks): вся история при каждом пуше и PR, плюс раз в неделю (обновлённые правила).
# Правила — .gitleaks.toml, разобранные старые находки — .gitleaksignore; для GitGuardian — .gitguardian.yaml.
# Находка валит сборку: секрет убрать из кода (в .env или генерировать при запуске) и сменить на стенде.
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks — вся история
        shell: bash
        run: |
          set -o pipefail
          { echo '```'
            docker run --rm --network none -v "$PWD:/repo:ro" -w /repo \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
              ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
              git --no-banner --redact --verbose --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore /repo 2>&1
            rc=$?; echo '```'; exit $rc; } | tee -a "$GITHUB_STEP_SUMMARY"
