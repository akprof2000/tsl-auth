# TLS-терминация на обратном прокси (кластерный режим). Используется docker-compose.ha-https.yml.
# Сертификаты: ./certs/tls.crt (с цепочкой) и ./certs/tls.key.
worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    server_tokens off;

    upstream tsl_auth {
        zone tsl_auth 64k;
        server auth1:8080 resolve max_fails=1 fail_timeout=5s;
        server auth2:8080 resolve max_fails=1 fail_timeout=5s;
        server auth3:8080 resolve max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    log_format upstream '$remote_addr "$request" $status -> $upstream_addr ($upstream_status) $request_time';
    access_log /dev/stdout upstream;

    # HTTP → HTTPS
    server {
        listen 8080;
        location = /lb-health { return 200 "ok\n"; }
        location / { return 301 https://$host:8443$request_uri; }   # поменяйте порт, если публикуете HTTPS не на 8443
    }

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate     /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;

        # HSTS ставит только nginx (и на свои ответы, например 502); заголовок сервиса скрывается,
        # иначе при Auth__RequireHttps=true в ответе было бы два Strict-Transport-Security.
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_hide_header Strict-Transport-Security;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 2s;

        location / {
            proxy_pass http://tsl_auth;
            proxy_read_timeout 60s;
        }

        # Выдача токенов: при сбое узла запрос повторяется на другом, даже если он уже был отправлен
        # (non_idempotent). Иначе POST, попавший на узел в момент его штатной остановки (Kestrel закрывает
        # соединения keep-alive), отдавался клиенту как 502. Повтор здесь безопасен: повтор refresh укладывается
        # в окно повторного использования токена, повтор остальных грантов лишь выдаёт ещё один токен.
        # Для прочих POST (изменения в админке, API) повтор по-прежнему запрещён — он мог бы создать дубликаты.
        location = /connect/token {
            proxy_pass http://tsl_auth;
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        }

        # Лента событий: long-polling (wait ≤ 60 с) и SSE — таймаут с запасом и без буферизации (см. nginx.conf).
        location /api/admin/events {
            proxy_pass http://tsl_auth;
            proxy_read_timeout 90s;
            proxy_buffering off;
        }
    }
}
