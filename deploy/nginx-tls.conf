# TLS-терминация на обратном прокси (кластерный режим). Используется docker-compose.ha-https.yml.
# Сертификаты: ./certs/tls.crt (с цепочкой) и ./certs/tls.key.
worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    server_tokens off;

    upstream tsl_auth {
        zone tsl_auth 64k;
        server auth1:8080 resolve max_fails=1 fail_timeout=5s;
        server auth2:8080 resolve max_fails=1 fail_timeout=5s;
        server auth3:8080 resolve max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    log_format upstream '$remote_addr "$request" $status -> $upstream_addr ($upstream_status) $request_time';
    access_log /dev/stdout upstream;

    # HTTP → HTTPS
    server {
        listen 8080;
        location = /lb-health { return 200 "ok\n"; }
        location / { return 301 https://$host:8443$request_uri; }   # поменяйте порт, если публикуете HTTPS не на 8443
    }

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate     /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass http://tsl_auth;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_buffering off;   # SSE-поток событий
        }
    }
}
