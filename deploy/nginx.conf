worker_processes auto;
events { worker_connections 1024; }

http {
    # Встроенный DNS Docker: адреса экземпляров перечитываются, поэтому перезапущенный
    # или пересозданный контейнер возвращается в балансировку автоматически.
    resolver 127.0.0.11 valid=5s ipv6=off;
    server_tokens off;   # не раскрывать версию nginx в заголовке Server и на страницах ошибок

    upstream tsl_auth {
        zone tsl_auth 64k;
        server auth1:8080 resolve max_fails=1 fail_timeout=5s;
        server auth2:8080 resolve max_fails=1 fail_timeout=5s;
        server auth3:8080 resolve max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    # Узел, обработавший запрос, пишется только в журнал nginx (stdout), а не в ответ клиенту:
    # внутренние адреса docker-сети наружу не раскрываются.
    log_format upstream '$remote_addr "$request" $status -> $upstream_addr ($upstream_status) $request_time';
    access_log /dev/stdout upstream;

    server {
        listen 8080;

        location = /lb-health { return 200 "ok\n"; }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Экземпляр недоступен — запрос уходит на следующий (сессии в общей БД, sticky не нужен).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 2s;

        location / {
            proxy_pass http://tsl_auth;
            proxy_read_timeout 30s;
        }

        # Выдача токенов: при сбое узла запрос повторяется на другом, даже если он уже был отправлен
        # (non_idempotent). Иначе POST, попавший на узел в момент его штатной остановки (Kestrel закрывает
        # соединения keep-alive), отдавался клиенту как 502. Повтор здесь безопасен: повтор refresh укладывается
        # в окно повторного использования токена, повтор остальных грантов лишь выдаёт ещё один токен.
        # Для прочих POST (изменения в админке, API) повтор по-прежнему запрещён — он мог бы создать дубликаты.
        location = /connect/token {
            proxy_pass http://tsl_auth;
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            # Ещё одна попытка с заново выбранным узлом, если все повторы выше не удались. Нужна на случай гонки:
            # адреса узлов перечитываются из DNS (resolve), и если это совпало с повтором запроса, nginx может
            # ответить «no live upstreams», хотя живой узел есть. Повтор делается один раз (error_page не рекурсивен),
            # при полном отказе кластера клиент по-прежнему сразу получает 502.
            error_page 502 504 = @token_retry;
        }

        location @token_retry {
            proxy_pass http://tsl_auth;
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        }

        # Лента событий: long-polling держит запрос до wait ≤ 60 с, SSE-поток открыт постоянно (пульс раз в 15 с).
        # Таймаут чтения с запасом больше 60 с — иначе nginx оборвёт ожидание (504) и повторит запрос
        # на следующих узлах; буферизация выключена, чтобы события SSE доходили сразу.
        location /api/admin/events {
            proxy_pass http://tsl_auth;
            proxy_read_timeout 90s;
            proxy_buffering off;
        }
    }
}
