# Источники данных Grafana эталонного стенда (всё хранение — Victoria):
#   VictoriaMetrics — метрики (совместима с Prometheus API, встроенный тип prometheus);
#   VictoriaLogs    — логи (плагин victoriametrics-logs-datasource, ставится при сборке образа Grafana);
#   VictoriaTraces  — трассировки (Jaeger Query API, встроенный тип jaeger).
# Связи: из строки лога — в трассировку по trace_id; из span'а — в логи того же trace_id.
apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      httpMethod: POST

  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    jsonData:
      derivedFields:
        - name: TraceID
          datasourceUid: victoriatraces
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"   # $$ — экранирование: Grafana не подставляет переменную окружения

  - name: VictoriaTraces
    uid: victoriatraces
    type: jaeger
    access: proxy
    url: http://victoriatraces:10428/select/jaeger
    jsonData:
      tracesToLogsV2:
        datasourceUid: victorialogs
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        customQuery: true
        query: 'trace_id:"$${__trace.traceId}"'
