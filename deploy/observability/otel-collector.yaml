# OpenTelemetry Collector эталонного стенда: принимает OTLP от TSL Auth (и любых приложений)
# и раскладывает сигналы по бэкендам: трассировки → Tempo, метрики → Prometheus (remote write), логи → Loki (OTLP).
# В стенде сервис шлёт коллектору только трассировки (метрики Prometheus забирает сам, логи идут в Loki напрямую),
# но конвейеры метрик и логов настроены — достаточно включить OBS_OTLP_METRICS / OBS_OTLP_LOGS.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true          # service.instance.id и прочие атрибуты ресурса — метками метрик
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
