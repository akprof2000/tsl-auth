# Prometheus для кластера (docker-compose.ha.yml + docker-compose.observability.yml, OBS_PROMETHEUS_CONFIG=deploy/observability/prometheus-ha.yml).
# Каждый узел опрашивается отдельно, минуя nginx: балансировщик отдал бы метрики случайного узла.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tsl-auth
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/token
    static_configs:
      - targets: ["auth1:8080"]
        labels: { instance: auth1 }
      - targets: ["auth2:8080"]
        labels: { instance: auth2 }
      - targets: ["auth3:8080"]
        labels: { instance: auth3 }

  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: tempo
    static_configs: [{ targets: ["tempo:3200"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]
