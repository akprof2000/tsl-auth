# Grafana Tempo (хранилище трассировок) эталонного стенда: один процесс, локальные файлы, хранение 3 дня.
# 3200 — HTTP API для запросов Grafana.
server:
  http_listen_port: 3200

# Приём трассировок по OTLP (gRPC 4317, HTTP 4318) — от OpenTelemetry Collector.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Блоки и журнал упреждающей записи (WAL) — в томе контейнера.
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Удаление трассировок старше 3 суток.
compactor:
  compaction:
    block_retention: 72h

# Метрики из span'ов (RED по сервисам) — Tempo считает сам и пишет в Prometheus; включает вкладку «Service graph» в Grafana.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
