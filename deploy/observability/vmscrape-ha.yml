# Опрос метрик VictoriaMetrics в кластере (docker-compose.ha.yml + docker-compose.observability.yml,
# OBS_VM_SCRAPE_CONFIG=deploy/observability/vmscrape-ha.yml). Формат — scrape_configs Prometheus, его понимает -promscrape.config.
# Каждый узел опрашивается отдельно, минуя nginx: балансировщик отдал бы метрики случайного узла.
# Сервис сам в VictoriaMetrics не пишет: метрики забираются с его /metrics (pull).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: tsl-auth
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/vmscrape/secret/token
    static_configs:
      - targets: ["auth1:8080"]
        labels: { instance: auth1 }
      - targets: ["auth2:8080"]
        labels: { instance: auth2 }
      - targets: ["auth3:8080"]
        labels: { instance: auth3 }

  # Компоненты стенда — чтобы видеть их состояние в Grafana.
  - job_name: victoriametrics
    static_configs: [{ targets: ["localhost:8428"] }]
  - job_name: victorialogs
    static_configs: [{ targets: ["victorialogs:9428"] }]
  - job_name: victoriatraces
    static_configs: [{ targets: ["victoriatraces:10428"] }]
  - job_name: vector
    static_configs: [{ targets: ["vector:9598"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]
