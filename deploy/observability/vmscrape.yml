# Опрос метрик VictoriaMetrics в одиночном режиме (docker-compose.yml + docker-compose.observability.yml).
# Формат — scrape_configs Prometheus, его понимает флаг -promscrape.config. Сервис сам в VictoriaMetrics не пишет:
# метрики забираются с его /metrics (pull) внутри docker-сети; сервис отдаёт их только из частных сетей
# и (если задан OBS_PROMETHEUS_TOKEN) по bearer-токену — см. authorization ниже.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: tsl-auth
    metrics_path: /metrics
    # Токен из OBS_PROMETHEUS_TOKEN (.env) пробрасывается файлом; при пустом токене файл пустой и не мешает.
    authorization:
      type: Bearer
      credentials_file: /etc/vmscrape/secret/token
    static_configs:
      - targets: ["auth:8080"]
        labels: { instance: auth }

  # Компоненты стенда — чтобы видеть их состояние в Grafana.
  - job_name: victoriametrics
    static_configs: [{ targets: ["localhost:8428"] }]
  - job_name: victorialogs
    static_configs: [{ targets: ["victorialogs:9428"] }]
  - job_name: victoriatraces
    static_configs: [{ targets: ["victoriatraces:10428"] }]
  - job_name: vector
    static_configs: [{ targets: ["vector:9598"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]
