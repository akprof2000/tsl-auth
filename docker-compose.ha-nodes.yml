# Прямой доступ к узлам кластера — только для диагностики и тестов отказоустойчивости (tests/resilience):
#   docker compose -f docker-compose.ha.yml -f docker-compose.ha-nodes.yml up -d
# Порты привязаны к 127.0.0.1 и в продуктиве не нужны. Учтите: даже локальный запрос к узлу приходит в контейнер
# с адреса шлюза docker-сети (частная сеть, которой узлы доверяют X-Forwarded-*), поэтому любой пользователь
# этого хоста может подставить в запрос чужой IP. Не держите оверлей включённым на многопользовательском сервере.

services:
  auth1:
    ports: ["127.0.0.1:8081:8080"]
  auth2:
    ports: ["127.0.0.1:8082:8080"]
  auth3:
    ports: ["127.0.0.1:8083:8080"]
