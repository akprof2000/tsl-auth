# Секреты кластера файлами (docker secrets), а не переменными окружения: мастер-ключ, пароль БД и пароли
# начальной настройки не видны в `docker inspect`, в окружении процессов и в .env. Поверх docker-compose.ha.yml:
#   AUTH_SECRETS_DIR=/etc/tsl-auth/secrets \
#   docker compose -f docker-compose.ha.yml -f docker-compose.ha-secrets.yml up -d
# (AUTH_SECRETS_DIR можно записать в .env; ENCRYPTION_MASTER_KEY и POSTGRES_PASSWORD тогда не нужны.)
#
# В каталоге AUTH_SECRETS_DIR (вне репозитория) — по одному значению на файл:
#   master_key                — мастер-ключ, base64 32 байта (Encryption__MasterKeyFile);
#   postgres_password         — пароль пользователя tsl_auth для контейнера postgres (POSTGRES_PASSWORD_FILE);
#   db_connection_string      — строка подключения узлов (Database__ConnectionStringFile), с тем же паролем:
#                               Host=postgres;Port=5432;Database=tsl_auth;Username=tsl_auth;Password=...
#   admin_password            — пароль первого администратора (Bootstrap__AdminPasswordFile);
#   admin_api_client_secret   — секрет клиента Admin API (Bootstrap__AdminApiClientSecretFile).
# Compose без Swarm монтирует файлы как есть (владелец и права сохраняются). Узлы работают под UID 1654,
# postgres — под своим пользователем, поэтому файлам нужны права на чтение всем (chmod 0444), а доступ
# посторонних закрывается правами каталога (chmod 0700, владелец — администратор хоста).

x-auth-secrets: &auth-secrets
  environment:
    # Пустые значения отменяют переменные из docker-compose.ha.yml: действуют только файлы.
    Database__ConnectionString: ""
    Database__ConnectionStringFile: /run/secrets/db_connection_string
    Encryption__MasterKey: ""
    Encryption__MasterKeyFile: /run/secrets/master_key
    Bootstrap__AdminPassword: ""
    Bootstrap__AdminPasswordFile: /run/secrets/admin_password
    Bootstrap__AdminApiClientSecret: ""
    Bootstrap__AdminApiClientSecretFile: /run/secrets/admin_api_client_secret
  secrets: [db_connection_string, master_key, admin_password, admin_api_client_secret]

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
  auth1: *auth-secrets
  auth2: *auth-secrets
  auth3: *auth-secrets

secrets:
  master_key:
    file: "${AUTH_SECRETS_DIR:?Задайте AUTH_SECRETS_DIR — каталог с файлами секретов}/master_key"
  postgres_password:
    file: "${AUTH_SECRETS_DIR:?Задайте AUTH_SECRETS_DIR — каталог с файлами секретов}/postgres_password"
  db_connection_string:
    file: "${AUTH_SECRETS_DIR:?Задайте AUTH_SECRETS_DIR — каталог с файлами секретов}/db_connection_string"
  admin_password:
    file: "${AUTH_SECRETS_DIR:?Задайте AUTH_SECRETS_DIR — каталог с файлами секретов}/admin_password"
  admin_api_client_secret:
    file: "${AUTH_SECRETS_DIR:?Задайте AUTH_SECRETS_DIR — каталог с файлами секретов}/admin_api_client_secret"
