# Эталонный стенд мониторинга на Victoria: VictoriaMetrics (метрики), VictoriaLogs (логи), VictoriaTraces (трассировки),
# Vector (сбор логов контейнеров через Docker socket), OpenTelemetry Collector (приём трассировок) и Grafana
# с готовым дашбордом «TSL Auth». Накладывается на любой режим:
#   docker compose -f docker-compose.yml    -f docker-compose.observability.yml up -d
#   docker compose -f docker-compose.ha.yml -f docker-compose.observability.yml up -d   (+ OBS_VM_SCRAPE_CONFIG, см. ниже)
#
# Сервисы в хранилища Victoria сами не пишут:
#   логи    — только stdout (Logging__Format=Json), Vector читает их через /var/run/docker.sock и отправляет в VictoriaLogs;
#   метрики — VictoriaMetrics забирает с /metrics сервиса (pull, OBS_PROMETHEUS_ENABLED=true);
#   трассировки — OTLP в коллектор (OBS_OTLP_ENDPOINT=http://otel-collector:4317), коллектор — в VictoriaTraces.
# Grafana: http://localhost:3000 (admin / OBS_GRAFANA_PASSWORD; просмотр без входа разрешён).
# Встроенные интерфейсы: VictoriaMetrics http://localhost:8428/vmui, VictoriaLogs http://localhost:9428/select/vmui.
# Порты привязаны к 127.0.0.1 — стенд для внутреннего использования.
# Образы для закрытого контура: scripts/export-images.ps1 -Observability (Grafana собирается с плагином VictoriaLogs).

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5", compress: "true" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: *logging

services:
  victoriametrics:
    <<: *hardening
    image: victoriametrics/victoria-metrics:v1.153.0
    container_name: tsl-auth-victoriametrics
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${OBS_METRICS_RETENTION:-15d}
      # Опрос /metrics по конфигурации в формате Prometheus (scrape_configs).
      - -promscrape.config=/etc/vmscrape/vmscrape.yml
    ports:
      - "127.0.0.1:${OBS_VM_PORT:-8428}:8428"
    volumes:
      # Одиночный режим — vmscrape.yml (цель auth:8080); кластер — OBS_VM_SCRAPE_CONFIG=deploy/observability/vmscrape-ha.yml.
      - ${OBS_VM_SCRAPE_CONFIG:-./deploy/observability/vmscrape.yml}:/etc/vmscrape/vmscrape.yml:ro
      - vmscrape-token:/etc/vmscrape/secret:ro
      - victoriametrics-data:/storage
    depends_on:
      vmscrape-token:
        condition: service_completed_successfully
    mem_limit: 512m

  # Токен для опроса /metrics (OBS_PROMETHEUS_TOKEN) попадает в VictoriaMetrics файлом, а не через окружение.
  vmscrape-token:
    image: victoriametrics/victoria-metrics:v1.153.0
    container_name: tsl-auth-vmscrape-token
    entrypoint: ["/bin/sh", "-c", "printf '%s' \"$$TOKEN\" > /secret/token"]
    environment:
      TOKEN: "${OBS_PROMETHEUS_TOKEN:-}"
    volumes:
      - vmscrape-token:/secret
    logging: *logging

  victorialogs:
    <<: *hardening
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: tsl-auth-victorialogs
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${OBS_LOGS_RETENTION:-30d}
    ports:
      - "127.0.0.1:${OBS_VLOGS_PORT:-9428}:9428"
    volumes:
      - victorialogs-data:/storage
    mem_limit: 512m

  victoriatraces:
    <<: *hardening
    image: victoriametrics/victoria-traces:v0.11.1
    container_name: tsl-auth-victoriatraces
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${OBS_TRACES_RETENTION:-7d}
    volumes:
      - victoriatraces-data:/storage
    mem_limit: 512m

  # Сбор логов: читает stdout/stderr всех контейнеров хоста через Docker socket (только чтение) — сервисы ничего не настраивают.
  vector:
    <<: *hardening
    image: timberio/vector:0.58.0-distroless-libc
    container_name: tsl-auth-vector
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./deploy/observability/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-data:/var/lib/vector
    depends_on: [victorialogs]
    mem_limit: 256m

  otel-collector:
    <<: *hardening
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: tsl-auth-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [victoriatraces, victoriametrics, victorialogs]
    mem_limit: 384m

  grafana:
    <<: *hardening
    # Образ с плагином VictoriaLogs собирается локально (deploy/observability/grafana/Dockerfile).
    build: ./deploy/observability/grafana
    image: tsl-auth-grafana:13.2.2-vl0.32.0
    container_name: tsl-auth-grafana
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${OBS_GRAFANA_PASSWORD:?задайте OBS_GRAFANA_PASSWORD в .env}"
      # Просмотр дашбордов без входа (только чтение) — стенд на 127.0.0.1; для общего сервера выключите.
      GF_AUTH_ANONYMOUS_ENABLED: "${OBS_GRAFANA_ANONYMOUS:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:${OBS_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [victoriametrics, victorialogs, victoriatraces]
    mem_limit: 512m

volumes:
  victoriametrics-data:
  vmscrape-token:
  victorialogs-data:
  victoriatraces-data:
  vector-data:
  grafana-data:
