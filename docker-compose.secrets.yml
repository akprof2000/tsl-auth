# Секреты одиночного режима файлами (docker secrets), а не переменными окружения: значения не видны
# в `docker inspect`, в окружении процесса и в .env. Накладывается поверх docker-compose.yml:
#   AUTH_SECRETS_DIR=/etc/tsl-auth/secrets docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# В каталоге AUTH_SECRETS_DIR (вне репозитория) — по одному значению на файл, без перевода строки в конце:
#   admin_password            — пароль первого администратора (Bootstrap__AdminPasswordFile);
#   admin_api_client_secret   — секрет клиента Admin API (нужен и BOOTSTRAP_API_CLIENT_ID).
# Compose без Swarm монтирует файл как есть, владелец и права сохраняются: сервис работает под UID 1654,
# поэтому файлы должны быть ему доступны на чтение (chmod 0444), а сам каталог закрыт от остальных (chmod 0700).
# Мастер-ключ в одиночном режиме генерируется в томе рядом с БД; перенести его в секрет — Encryption__MasterKeyFile
# (как в docker-compose.ha-secrets.yml), с тем же значением, что в master.key.

services:
  auth:
    environment:
      # Пустые значения отменяют переменные из docker-compose.yml: действуют только файлы.
      Bootstrap__AdminPassword: ""
      Bootstrap__AdminPasswordFile: /run/secrets/admin_password
      Bootstrap__AdminApiClientSecret: ""
      Bootstrap__AdminApiClientSecretFile: /run/secrets/admin_api_client_secret
    secrets: [admin_password, admin_api_client_secret]

secrets:
  admin_password:
    file: "${AUTH_SECRETS_DIR:?Задайте AUTH_SECRETS_DIR — каталог с файлами секретов}/admin_password"
  admin_api_client_secret:
    file: "${AUTH_SECRETS_DIR:?Задайте AUTH_SECRETS_DIR — каталог с файлами секретов}/admin_api_client_secret"
