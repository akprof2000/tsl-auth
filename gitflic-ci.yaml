# Конвейер GitFlic (https://gitflic.ru/project/uklad/tsl-auth). Что собирается на GitFlic, остаётся на GitFlic:
# образ публикуется только в реестр GitFlic ($CI_REGISTRY_IMAGE). GitHub собирает независимо и публикует
# в Docker Hub и GHCR (.github/workflows). Исходники приходят зеркалом с GitHub (mirror-gitflic.yml),
# каждый push в main и тег v* запускает этот конвейер.
#
# Агента на gitflic.ru нужно подключить свой (общих агентов нет): Docker-агент с PRIVILEGED=true для docker:dind —
# инструкция в docs/gitflic-ci.md. Задания помечены тегом tsl-auth, чтобы попадать только на этот агент.
#
# Этапы: сборка+unit, образ и проверка документации параллельно → интеграционные (SQLite и PostgreSQL/OpenBao
# в Testcontainers через docker:dind) и Trivy параллельно → публикация (main — latest и sha, тег — X.Y.Z) → релиз.
# После каждого dotnet test — scripts/ci-check-trx.sh: без выполненных тестов задание красное.
# Агент выполняет до 3 заданий одновременно (см. docs/gitflic-ci.md), кэш NuGet общий между конвейерами.

# Стадии: build — сборка решения и образа, проверка документации (все три параллельно);
# test — интеграционные тесты и Trivy (параллельно); publish → release.
# Версии на GitFlic свои и от тегов GitHub не зависят: MAJOR.MINOR берётся из файла sdk/VERSION, PATCH — номер
# конвейера ($CI_PIPELINE_ID). Каждый успешный прогон main публикует образ tsl-auth:<версия> (плюс latest) и пакеты
# клиентских библиотек той же версии в реестр пакетов этого проекта (NuGet, npm, PyPI, Maven; модуль Go —
# сам репозиторий, go.gitflic.ru/uklad/tsl-auth/sdk/go). Тег vX.Y.Z с GitHub публикует ещё и версию X.Y.Z образа.
# Контрактные тесты SDK (sdk-contract) идут здесь же; GitHub — только копия исходников (его workflow отключены).
stages:
  - build
  - test
  - publish
  - release

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Пакеты NuGet — в рабочем каталоге проекта: только его GitFlic кэширует между конвейерами (см. cache ниже).
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages

  SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0
  # Docker внутри заданий — сервис docker:dind (alias docker) без TLS: он доступен только внутри задания.
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  # Testcontainers запускает PostgreSQL и OpenBao в том же dind и обращается к ним по имени сервиса.
  TESTCONTAINERS_HOST_OVERRIDE: docker
  TESTCONTAINERS_RYUK_DISABLED: "true"
  # Путь образа в реестре GitFlic: registry.gitflic.ru/project/<владелец>/<проект>/<имя образа>:<тег>.
  # $CI_REGISTRY_IMAGE даёт только .../project/<владелец>/<проект> — имя образа добавляется здесь.
  IMAGE_REPO: $CI_REGISTRY_IMAGE/tsl-auth
  IMAGE_SHA: $CI_REGISTRY_IMAGE/tsl-auth:sha-$CI_COMMIT_SHA
  # Реестр пакетов проекта: https://registry.gitflic.ru/project/<владелец>/<проект>/package/-/<тип>.
  # Вход — учётная запись и транспортный токен из переменных проекта GITFLIC_PKG_USER / GITFLIC_PKG_TOKEN
  # (Настройки → CI/CD → Переменные); без них задания публикации пакетов пропускаются.
  PKG_BASE: https://$CI_REGISTRY_IMAGE/package/-

# Кэш NuGet общий для всех заданий и конвейеров: restore из кэша — секунды вместо ~2 минут на задание.
cache:
  key: nuget
  paths: [.nuget/packages/]

# Конвейер — только для main и тегов v*: ветки-черновики агента не занимают.
# Имена заданий не совпадают с ключевыми словами (image, release, services…): иначе файл не разбирается.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

build-and-unit:
  stage: build
  image: $SDK_IMAGE
  tags: [tsl-auth]
  script:
    - dotnet restore TslAuth.sln
    - dotnet build TslAuth.sln -c Release --no-restore -warnaserror
    - dotnet test tests/TslAuth.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults
    # dotnet test без собранных бинарников или без найденных тестов молча выходит с кодом 0 — проверяем .trx.
    - sh scripts/ci-check-trx.sh TestResults/unit.trx 100
  artifacts:
    paths: [TestResults/]
    when: always
    expire_in: 1 day

integration-tests:
  stage: test
  image: $SDK_IMAGE
  tags: [tsl-auth]
  # Только после unit-тестов и без чужих артефактов: без needs задание тянуло image.tar (200 МБ) из build-image,
  # а большие загрузки с GitFlic на агент обрываются («File download error»).
  needs: [build-and-unit]
  services:
    - name: docker:28-dind
      alias: docker
      command: ["--tls=false"]
  script:
    # Сервис docker:dind стартует вместе с заданием: ждём демон до 60 с, иначе первая же команда падает.
    - for i in $(seq 1 60); do wget -q -O /dev/null http://docker:2375/_ping 2>/dev/null && break; sleep 1; done; wget -q -O - http://docker:2375/_ping; echo
    # Сборка здесь же: артефакты с glob-путями bin/obj GitFlic не переносит, а restore идёт из кэша NuGet за секунды.
    - dotnet test tests/TslAuth.IntegrationTests -c Release --logger "trx;LogFileName=integration.trx" --results-directory TestResults
    - sh scripts/ci-check-trx.sh TestResults/integration.trx 100
  artifacts:
    paths: [TestResults/]
    when: always
    expire_in: 1 day

# Контрактные тесты пяти SDK против живого сервиса (docs/client-contract.md §8): сервис собирается из исходников
# в docker:dind (образ из build-image не берётся — большие артефакты до агента не доезжают), инструменты пяти языков
# ставятся в образ .NET SDK (Node 22 — с NodeSource, в Ubuntu 24.04 только 18).
sdk-contract:
  stage: test
  image: $SDK_IMAGE
  tags: [tsl-auth]
  needs: [build-and-unit]
  services:
    - name: docker:28-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    AUTH_ISSUER: http://docker:8080/
    BOOTSTRAP_API_CLIENT_ID: admin-cli
  script:
    - for i in $(seq 1 60); do wget -q -O /dev/null http://docker:2375/_ping 2>/dev/null && break; sleep 1; done
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends docker.io docker-compose-v2 xxd golang-go maven openjdk-21-jdk-headless python3-venv curl ca-certificates gnupg >/dev/null
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null 2>&1 && apt-get install -y -qq nodejs >/dev/null && node -v
    - python3 -m venv /tmp/venv && . /tmp/venv/bin/activate && pip install --quiet build fastapi flask httpx
    # Секреты стенда случайные на каждый прогон; они попадают только в vectors.json на агенте (в артефакты не выгружается).
    - export BOOTSTRAP_API_CLIENT_SECRET="ci-$(head -c 16 /dev/urandom | xxd -p | head -c 32)" BOOTSTRAP_ADMIN_PASSWORD="Ci-$(head -c 16 /dev/urandom | xxd -p | head -c 32)!"
    - docker compose up -d --build
    - for i in $(seq 1 90); do wget -q -O /dev/null http://docker:8080/health/ready 2>/dev/null && break; sleep 2; done; wget -q -O - http://docker:8080/health/ready; echo
    - PATH=/tmp/venv/bin:$PATH pwsh -NoProfile -File tests/sdk-contract/run.ps1 -NoStand -Issuer http://docker:8080/
    - sh scripts/ci-check-trx.sh TestResults/sdk-dotnet.trx 20
  after_script:
    - docker compose down -v >/dev/null 2>&1 || true
  artifacts:
    paths: [TestResults/]
    when: always
    expire_in: 1 day

# E2E-стенд (перенесён с GitHub): сервис из исходников в docker:dind + четыре демо-приложения в контейнере задания →
# UI-автотесты (Playwright), нагрузка (k6, локальный бинарник), сценарии отказов одиночного режима, секреты через env/файл.
# Порты стенда публикуются на хосте dind (alias docker), а скрипты и браузер ходят на localhost — их сводит socat.
# Кластер (docker-compose.ha.yml), стенд мониторинга и OpenBao здесь не проверяются: их compose-файлы монтируют
# каталоги репозитория, которых нет на хосте dind (bind mount) — они остаются ручной проверкой перед релизом.
e2e-stand:
  stage: test
  image: $SDK_IMAGE
  tags: [tsl-auth]
  needs: [build-and-unit]
  services:
    - name: docker:28-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    BOOTSTRAP_API_CLIENT_ID: admin-cli
    BOOTSTRAP_API_CLIENT_SECRET: demo-admin-cli-secret-2026
    SECURITY_TOKEN_RPM: "1000000"
    SECURITY_LOGIN_RPM: "1000000"
    K6_LOCAL: "1"
  script:
    - for i in $(seq 1 60); do wget -q -O /dev/null http://docker:2375/_ping 2>/dev/null && break; sleep 1; done
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends docker.io docker-compose-v2 socat golang-go python3 curl ca-certificates gnupg >/dev/null
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null 2>&1 && apt-get install -y -qq nodejs >/dev/null
    - ln -sf /usr/bin/python3 /usr/local/bin/python
    - curl -fsSL https://github.com/grafana/k6/releases/download/v1.3.0/k6-v1.3.0-linux-amd64.tar.gz | tar -xz --strip-components=1 -C /usr/local/bin k6-v1.3.0-linux-amd64/k6 && k6 version
    # localhost:8080–8099 контейнера задания → хост dind: так стенд виден скриптам и Chromium под привычными адресами.
    - for p in $(seq 8080 8099); do socat TCP-LISTEN:$p,fork,reuseaddr TCP:docker:$p & done; sleep 1
    - export BOOTSTRAP_ADMIN_PASSWORD="Ci-$(head -c 16 /dev/urandom | xxd -p | head -c 32)!"
    - docker compose up -d --build
    - for i in $(seq 1 90); do wget -q -O /dev/null http://localhost:8080/health/ready 2>/dev/null && break; sleep 2; done; wget -q -O - http://localhost:8080/health/ready; echo
    - pwsh -NoProfile -File samples/seed-demo.ps1
    - pwsh -NoProfile -File tests/e2e/start-demos.ps1
    - dotnet build tests/TslAuth.UiTests -c Release --nologo -v quiet
    - pwsh -NoProfile -File tests/TslAuth.UiTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium >/dev/null
    - dotnet test tests/TslAuth.UiTests -c Release --no-build --logger "trx;LogFileName=ui.trx" --results-directory TestResults
    - sh scripts/ci-check-trx.sh TestResults/ui.trx 10
    - docker compose up -d
    - pwsh -NoProfile -File tests/load/run-load.ps1 -Name ci-single -Vus 10 -Duration 30s
    - docker compose down -v
    - pwsh -NoProfile -File tests/resilience/run-resilience.ps1 -Mode single
    - docker compose down -v
    - pwsh -NoProfile -File tests/resilience/run-env-secrets.ps1
  after_script:
    - mkdir -p tests/artifacts; docker ps -a > tests/artifacts/containers.txt 2>/dev/null; for c in $(docker ps -a --format '{{.Names}}' 2>/dev/null); do docker logs "$c" > "tests/artifacts/container-$c.log" 2>&1; done
    - docker compose down -v >/dev/null 2>&1 || true
  artifacts:
    paths: [TestResults/, tests/artifacts/]
    when: always
    expire_in: 1 day

validate-docs:
  stage: build
  image: $SDK_IMAGE
  tags: [tsl-auth]
  cache: []
  script:
    # Ссылки, якоря, таблицы и актуальность картинок схем; синтаксис Mermaid проверяет CI на GitHub
    # (ему нужен Docker с mermaid-cli), здесь — без него.
    - pwsh -NoProfile -File scripts/validate-docs.ps1 -SkipMermaid

build-image:
  stage: build
  image: docker:28
  tags: [tsl-auth]
  cache: []
  services:
    - name: docker:28-dind
      alias: docker
      command: ["--tls=false"]
  script:
    # Сервис docker:dind стартует вместе с заданием: ждём демон до 60 с, иначе первая же команда падает.
    - for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done; docker info --format '{{.ServerVersion}}'
    - docker build --pull -t "$IMAGE_SHA" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" .
    - docker save "$IMAGE_SHA" -o image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 2 hours

# Уязвимости HIGH/CRITICAL с исправлением — ошибка сборки (как Trivy в CI на GitHub). Сканируется архив образа,
# поэтому Docker для проверки не нужен.
scan-image:
  stage: test
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  tags: [tsl-auth]
  cache: []
  needs: [build-image]
  script:
    - trivy image --input image.tar --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --no-progress

publish-image:
  stage: publish
  # Публикация идёт с агента (вся сборка — на GitFlic). Агенту нужен исправный путь до registry.gitflic.ru: с сервера,
  # где большие передачи в реестр обрываются, задания зависают — тогда переменная GITFLIC_PUBLISH_FROM_AGENT=false их отключает.
  rules:
    - if: $GITFLIC_PUBLISH_FROM_AGENT != "false"
  # crane — клиент реестра без демона Docker: демон dind на агенте не дожидается ответа registry.gitflic.ru
  # (curl, Go и crane из того же контейнера отвечают за 0,2 с), а crane грузит image.tar напрямую.
  # Образ crane:debug без /bin/sh (shell в /busybox/sh), а раннер запускает скрипт через /bin/sh — поэтому alpine + crane из apk.
  image: alpine:3.22
  tags: [tsl-auth]
  # Публикация только после ВСЕХ проверок: без явного needs GitFlic запускал publish, пока интеграционные тесты ещё шли.
  needs: [build-and-unit, integration-tests, sdk-contract, e2e-stand, build-image, scan-image]
  script:
    - apk add --no-cache crane
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - crane push image.tar "$IMAGE_SHA"
    # Версия GitFlic: MAJOR.MINOR из sdk/VERSION + номер конвейера; на main — ещё latest, на теге — ещё X.Y.Z.
    - crane tag "$IMAGE_SHA" "$(tr -d '[:space:]' < sdk/VERSION).$CI_PIPELINE_ID"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        crane tag "$IMAGE_SHA" "${CI_COMMIT_TAG#v}"
      else
        crane tag "$IMAGE_SHA" latest
      fi

# Релиз GitFlic на тег vX.Y.Z: страница релиза со ссылкой на образ в реестре GitFlic.
gitflic-release:
  stage: release
  image: registry.gitflic.ru/company/gitflic/gcli:latest
  tags: [tsl-auth]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  release:
    name: "$CI_COMMIT_TAG"
    description: "TSL Auth $CI_COMMIT_TAG. Образ: $CI_REGISTRY_IMAGE (тег без «v»). Заметки о выпуске — в CHANGELOG релиза на GitHub."
    tag_name: "$CI_COMMIT_TAG"
  script:
    - echo "Релиз $CI_COMMIT_TAG"

# ---------- Пакеты SDK (каждый прогон main; версия = sdk/VERSION + номер конвейера, например 1.4.19) ----------
# Каждый пакет собирается в образе своего инструмента, поэтому заданий четыре; они идут параллельно после образа.
# Нужны переменные проекта GITFLIC_PKG_USER / GITFLIC_PKG_TOKEN (логин и транспортный токен); без них задания пропускаются.
.sdk-publish:
  stage: release
  tags: [tsl-auth]
  cache: []
  needs: [publish-image]
  rules:
    - if: $GITFLIC_PUBLISH_FROM_AGENT != "false" && $GITFLIC_PKG_TOKEN
  before_script:
    - export SDK_VERSION="$(tr -d '[:space:]' < sdk/VERSION).$CI_PIPELINE_ID"
    - echo "Версия пакетов GitFlic — $SDK_VERSION"

publish-sdk-nuget:
  extends: .sdk-publish
  image: $SDK_IMAGE
  script:
    - dotnet pack sdk/dotnet/TslAuth.Client/TslAuth.Client.csproj -c Release -p:Version="$SDK_VERSION" -o dist/nuget
    - dotnet nuget add source "$PKG_BASE/nuget/index.json" -n gitflic -u "$GITFLIC_PKG_USER" -p "$GITFLIC_PKG_TOKEN" --store-password-in-clear-text
    - dotnet nuget push dist/nuget/*.nupkg -s gitflic -k "$GITFLIC_PKG_TOKEN" --skip-duplicate

publish-sdk-npm:
  extends: .sdk-publish
  image: node:22-alpine
  script:
    - cd sdk/node
    - npm version "$SDK_VERSION" --no-git-tag-version --allow-same-version
    - echo "//${PKG_BASE#https://}/npm/:_authToken=$GITFLIC_PKG_TOKEN" > .npmrc
    - npm publish --registry "$PKG_BASE/npm/"

publish-sdk-pypi:
  extends: .sdk-publish
  image: python:3.12-alpine
  script:
    - pip install --quiet build twine
    - cd sdk/python
    - sed -i -E "s/^version = \"[^\"]+\"/version = \"$SDK_VERSION\"/" pyproject.toml
    - python -m build
    - TWINE_USERNAME="$GITFLIC_PKG_USER" TWINE_PASSWORD="$GITFLIC_PKG_TOKEN" python -m twine upload --repository-url "$PKG_BASE/pypi" --skip-existing dist/*

publish-sdk-maven:
  extends: .sdk-publish
  image: maven:3.9-eclipse-temurin-21-alpine
  script:
    - cd sdk/java
    - |
      mkdir -p ~/.m2 && cat > ~/.m2/settings.xml <<EOF
      <settings><servers><server><id>gitflic</id><username>$GITFLIC_PKG_USER</username><password>$GITFLIC_PKG_TOKEN</password></server></servers></settings>
      EOF
    - mvn -B -q -Drevision="$SDK_VERSION" -DskipTests deploy -DaltDeploymentRepository="gitflic::$PKG_BASE/maven"

# ---------- Очистка после сборки (место на GitFlic ограничено) ----------
# Артефакты заданий живут часы/сутки (expire_in выше), а здесь в реестре пакетов (образ, NuGet, npm, PyPI, Maven)
# и в релизах остаётся не больше трёх новейших версий. Нужна переменная проекта GITFLIC_API_TOKEN (API-токен профиля:
# Настройки → «API токены»); без неё задание пропускается. Первый прогон можно сделать с DRY_RUN=1 в переменных.
cleanup:
  stage: release
  image: alpine:3.22
  tags: [tsl-auth]
  cache: []
  needs: [integration-tests, scan-image]
  rules:
    - if: $GITFLIC_API_TOKEN
  variables:
    KEEP: "3"
  script:
    - apk add --no-cache curl jq
    - sh scripts/gitflic-prune.sh
