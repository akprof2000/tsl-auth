# Демо с сервером авторизации на другой машине: TSL Auth запущен отдельно (например, на мощном стенде),
# здесь — только API, PWA и бот. Все обращения (браузер и сервер→сервер) идут на внешний адрес AUTH_URL.
#   1) на машине с TSL Auth:  AUTH_ISSUER=http://<её-ip>:8080/  BOOTSTRAP_API_CLIENT_ID=admin-cli  BOOTSTRAP_API_CLIENT_SECRET=...
#                             docker compose up -d   (корень репозитория)
#   2) здесь:  ./seed.ps1 -Issuer http://<её-ip>:8080 -AdminClientSecret ... -WebOrigins http://localhost:5200
#   3) здесь:  AUTH_URL=http://<её-ip>:8080 docker compose -f docker-compose.yml -f docker-compose.remote-auth.yml up -d --build docflow-api docflow-bot
# Требуется Docker Compose 2.24+ (теги !override).
services:
  docflow-api:
    depends_on: !override [docflow-bot]
    environment:
      Auth__Issuer: "${AUTH_URL:?Задайте AUTH_URL=http://<ip-сервера-авторизации>:8080}/"
      Auth__InternalUrl: "${AUTH_URL}/"

  docflow-bot:
    depends_on: !override []
    environment:
      Auth__Issuer: "${AUTH_URL}/"
      Auth__InternalUrl: "${AUTH_URL}/"
