# Демо «Документооборот» на готовом образе TSL Auth с Docker Hub. Все секреты — в OpenBao
# (единое хранилище секретов ТСЛ): в окружении контейнеров и в .env секретов нет.
#   Проще всего: demo-start.cmd в корне репозитория. Вручную:
#   1) docker compose up -d tsl-auth        — OpenBao (инициализация, AppRole, секреты TSL Auth) + TSL Auth (http://localhost:8080)
#   2) ./seed.ps1                           — приложения, роли, сотрудники; секреты клиентов → OpenBao
#   3) docker compose up -d --build         — API + PWA (http://localhost:5200) и бот
# Пароль администратора TSL Auth:
#   docker compose exec openbao sh /openbao/scripts/bao.sh kv get -field=Bootstrap__AdminPassword secret/tsl-auth
# Порты: DOCFLOW_AUTH_PORT (8080) и DOCFLOW_WEB_PORT (5200) — если заняты другим стендом.
# Свой образ TSL Auth: TSL_AUTH_IMAGE=tsl-auth:local (docker build -t tsl-auth:local в корне репозитория).
name: docflow-demo

x-openbao: &openbao-client
  OpenBao__Address: http://openbao:8200

services:
  openbao:
    image: openbao/openbao:2.4.1
    container_name: docflow-openbao
    restart: unless-stopped
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ../../deploy/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - ../../deploy/openbao:/openbao/scripts:ro
      - openbao-data:/openbao/file
      - openbao-init:/openbao/init:ro
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null 2>&1; [ $$? -ne 1 ]"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Инициализация и распечатывание хранилища, AppRole для трёх сервисов, секреты TSL Auth.
  openbao-init:
    image: openbao/openbao:2.4.1
    restart: "no"
    entrypoint: ["sh", "/openbao/scripts/init.sh"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      OPENBAO_APPS: "tsl-auth docflow-api docflow-bot"
    depends_on:
      openbao: { condition: service_healthy }
    volumes:
      - ../../deploy/openbao:/openbao/scripts:ro
      - openbao-init:/openbao/init
      - openbao-approle:/openbao/approle

  tsl-auth:
    image: ${TSL_AUTH_IMAGE:-akprof2000/tsl-auth:latest}
    container_name: docflow-tsl-auth
    restart: unless-stopped
    ports: ["${DOCFLOW_AUTH_PORT:-8080}:8080"]
    depends_on:
      openbao-init: { condition: service_completed_successfully }
    environment:
      <<: *openbao-client
      OpenBao__Path: tsl-auth
      OpenBao__RoleIdFile: /run/openbao/tsl-auth/role_id
      OpenBao__SecretIdFile: /run/openbao/tsl-auth/secret_id
      Database__Provider: Sqlite
      Database__ConnectionString: "Data Source=/app/data/tsl-auth.db"
      Auth__Issuer: "http://localhost:${DOCFLOW_AUTH_PORT:-8080}/"
      Auth__RequireHttps: "false"
      Bootstrap__AdminUserName: admin
      # Клиент Admin API для seed.ps1; его секрет, пароль администратора и мастер-ключ — в secret/tsl-auth.
      Bootstrap__AdminApiClientId: admin-cli
    volumes:
      - auth-data:/app/data
      - openbao-approle:/run/openbao:ro

  docflow-api:
    build: { context: ., dockerfile: api/Dockerfile }
    image: docflow-demo-api:latest
    container_name: docflow-api
    restart: unless-stopped
    depends_on: [tsl-auth, docflow-bot]
    ports: ["${DOCFLOW_WEB_PORT:-5200}:8080"]
    environment:
      <<: *openbao-client
      OpenBao__Path: docflow-api                        # Auth__ClientSecret пишет seed.ps1
      OpenBao__RoleIdFile: /run/openbao/docflow-api/role_id
      OpenBao__SecretIdFile: /run/openbao/docflow-api/secret_id
      Auth__Issuer: "http://localhost:${DOCFLOW_AUTH_PORT:-8080}/"          # как в токенах (адрес для браузера)
      Auth__InternalUrl: "http://tsl-auth:8080/"      # адрес внутри сети Docker
      BotUrl: "http://docflow-bot:8080/"
    volumes:
      - docflow-data:/app/data
      - openbao-approle:/run/openbao:ro

  docflow-bot:
    build: { context: ., dockerfile: bot/Dockerfile }
    image: docflow-demo-bot:latest
    container_name: docflow-bot
    restart: unless-stopped
    depends_on: [tsl-auth]
    environment:
      <<: *openbao-client
      OpenBao__Path: docflow-bot                        # Auth__BotClientSecret пишет seed.ps1
      OpenBao__RoleIdFile: /run/openbao/docflow-bot/role_id
      OpenBao__SecretIdFile: /run/openbao/docflow-bot/secret_id
      Auth__Issuer: "http://localhost:${DOCFLOW_AUTH_PORT:-8080}/"
      Auth__InternalUrl: "http://tsl-auth:8080/"
    volumes:
      - openbao-approle:/run/openbao:ro

volumes:
  auth-data:
  docflow-data:
  openbao-data:
  openbao-init:
  openbao-approle:
